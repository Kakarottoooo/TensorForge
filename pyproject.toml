[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "tensorforge-runtime"
version = "0.6.0"
description = "A benchmark-driven GPU inference runtime and kernel optimization laboratory."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "TensorForge Contributors" }]
dependencies = ["torch>=2.5"]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.7",
]
kernels = [
  "numpy>=2,<3; platform_system == 'Linux'",
  "setuptools>=70; platform_system == 'Linux'",
  "triton>=3.1,<3.2; platform_system == 'Linux'",
]

[tool.hatch.build.targets.wheel]
packages = ["tensorforge"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "cuda: requires a CUDA-capable GPU",
  "triton: requires Triton and a supported CUDA environment",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
